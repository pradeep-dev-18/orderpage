<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Swiggy</title>
</head>

<style>
   body{
    text-align: center;
   }
   h1{
    color: orange;
   }
   .contact-container{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 3px;
    }
    .info{
        width: 300px;
        padding: 20px;
        border: 2px solid black;
        border-radius: 5px;
    }.info h2{
        color: orange;
    }
    .form-box{
        width: 300px;
        padding: 20px;
        border: 2px solid black;
        border-radius: 5px;
    }
    input,textarea{
        width: 100%;
        padding: 5px;
    }
    button{
        background-color: orange;
    }
    
   
</style>

<body>

    <h1>Contact Us</h1>

    <div class="contact-container">

        <!-- Contact Info -->
        <div class="info">
            <h2>Get in Touch</h2>
            <p>📍 Chennai, India</p>
            <p>📞 +91 9876543210</p>
            <p>📧 support@swiggyclone.com</p>
            <p>🕒 Mon - Sun: 9 AM - 10 PM</p>
        </div>

        <!-- Contact Form -->
        <div class="form-box">
            <h2>Send a Message</h2>

            <form onsubmit="showMessage(event)">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea rows="4" placeholder="Your Message" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>

    </div>

    <script>
        function showMessage(e) {
            e.preventDefault();
            alert("Message sent successfully ✅");
        }
    </script>

</body>
</html>
